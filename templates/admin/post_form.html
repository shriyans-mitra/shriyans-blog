{% extends 'base.html' %}
{% block title %}{{ 'Edit Post' if post else 'New Post' }} · Admin{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-6">

    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">{{ 'Edit Post' if post else 'New Post' }}</h1>
        <a href="/admin" class="text-sm text-gray-500 hover:underline">← Dashboard</a>
    </div>

    <form method="POST" id="post-form" class="space-y-5">

        <div>
            <label class="block text-sm font-medium mb-1">Title</label>
            <input type="text" name="title" required
                   value="{{ post.title if post else '' }}"
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 dark:focus:ring-white text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">
                Excerpt
                <span class="font-normal text-gray-400">(optional — shown on home page)</span>
            </label>
            <textarea name="excerpt" rows="2"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 dark:focus:ring-white text-sm resize-none">{{ post.excerpt if post else '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Category</label>
            <select name="category_id"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 dark:focus:ring-white text-sm">
                <option value="">No category</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}"
                        {{ 'selected' if post and post.category_id == cat.id else '' }}>
                    {{ cat.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Content</label>
            <!-- Quill renders here -->
            <div id="editor"
                 class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg"
                 style="min-height: 300px;">
                {{ post.content | safe if post else '' }}
            </div>
            <!-- Hidden field that gets filled with Quill's HTML on submit -->
            <input type="hidden" name="content" id="content-input">
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" name="published" id="published"
                   {{ 'checked' if (not post or post.published) else '' }}
                   class="w-4 h-4 rounded accent-gray-900 dark:accent-white">
            <label for="published" class="text-sm font-medium">
                Published <span class="font-normal text-gray-400">(uncheck to save as draft)</span>
            </label>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="px-5 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg text-sm font-semibold hover:opacity-80 transition-opacity">
                {{ 'Update Post' if post else 'Publish Post' }}
            </button>
            <a href="/admin"
               class="px-5 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                Cancel
            </a>
        </div>

    </form>
</div>

<!-- Quill CSS -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<!-- Quill JS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>
    const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your post here...',
        modules: {
            toolbar: [
                [{ header: [2, 3, false] }],
                ['bold', 'italic', 'underline'],
                ['blockquote', 'code-block'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                ['link'],
                ['clean']
            ]
        }
    });

    // Before the form submits, copy Quill's HTML into the hidden input
    document.getElementById('post-form').addEventListener('submit', function () {
        document.getElementById('content-input').value = quill.root.innerHTML;
    });
</script>
{% endblock %}
